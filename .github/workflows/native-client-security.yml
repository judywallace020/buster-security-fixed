name: Native Client Security Helpers

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "native-client-hardening/**"
      - ".github/workflows/native-client-security.yml"
  push:
    branches:
      - "security/native-client-hardening"
    paths:
      - "native-client-hardening/**"
      - ".github/workflows/native-client-security.yml"

jobs:
  test:
    name: Go helper tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.13.15", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test helper module
        working-directory: native-client-hardening/security
        run: go test ./...
      - name: Vet helper module
        working-directory: native-client-hardening/security
        run: go vet ./...

  native-client-build:
    name: Native client build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2022
          - os: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - name: Set up Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Install Linux native input dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxrender-dev libxext-dev libxkbfile-dev libpng-dev
      - name: Build and validate native messaging client
        working-directory: native-client-hardening/upstream/cmd/client
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          go mod download
          go test ./...
          go vet ./...
          go build ./...
